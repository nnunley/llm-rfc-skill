# checkmake's minphony rule asserts a convention this series does not use:
# it requires all/clean/test AND requires them declared .PHONY. The gate
# here is `check`, and .PHONY is declared only against a real collision
# with a path on disk, never as blanket decoration. Disabled rather than
# worked around, so the disagreement is on the record instead of hidden in
# a target nobody calls.
[minphony]
disabled = true
