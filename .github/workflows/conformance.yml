name: RFC Conformance

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint RFC documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run rfc-lint on all RFCs and drafts
        run: |
          shopt -s nullglob
          for file in rfc/draft-*.md rfc/[0-9]*.md; do
            skill/rfc-lint "$file" || exit 1
          done
        shell: bash

  evidence:
    name: Verify published RFC evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run rfc-run on published RFCs (blocking)
        run: |
          if ls rfc/[0-9]*.md >/dev/null 2>&1; then
            skill/rfc-run rfc/[0-9]*.md
          else
            echo "No published RFCs found (all drafts)"
          fi
        shell: bash

      - name: Run rfc-run on drafts (reported, not blocking — drafts may be spec-first red)
        run: |
          shopt -s nullglob
          for file in rfc/draft-*.md; do
            skill/rfc-run "$file" || echo "::warning::draft corpus not green: $file"
          done
        shell: bash
