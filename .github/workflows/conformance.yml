name: RFC Conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    name: RFC conformance (rfc-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full gate — lint, published evidence, draft declarations, digest invariants
        run: skill/rfc-check rfc
        shell: bash

      - name: Per-document conformance report
        if: always()
        run: |
          shopt -s nullglob
          {
            echo "### RFC conformance — per document"
            echo ""
            echo "| document | lint | corpus | declared | digest |"
            echo "|---|---|---|---|---|"
            for f in rfc/draft-*.md rfc/[0-9]*.md; do
              n=$(basename "$f" .md)
              skill/rfc-lint "$f" >/dev/null 2>&1 && L="ok" || L="**FAIL**"
              if skill/rfc-run "$f" >/dev/null 2>&1; then C="green"; else C="red"; fi
              d=$(sed -n 's/^\*\*Corpus:\*\* *//p' "$f" | head -1); d="${d%% *}"; d="${d:-green}"
              [ "$C" = "$d" ] && D="$d" || D="**$d (STALE)**"
              skill/rfc-render-llm --verify "$f" >/dev/null 2>&1 && G="ok" || G="**FAIL**"
              echo "| $n | $L | $C | $D | $G |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
