name: RFC Conformance

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint RFC documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run rfc-lint on all RFCs and drafts
        run: |
          shopt -s nullglob
          for file in rfc/draft-*.md rfc/[0-9]*.md; do
            skill/rfc-lint "$file" || exit 1
          done
        shell: bash

  evidence:
    name: Verify published RFC evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run rfc-run on published RFCs (blocking)
        run: |
          if ls rfc/[0-9]*.md >/dev/null 2>&1; then
            skill/rfc-run rfc/[0-9]*.md
          else
            echo "No published RFCs found (all drafts)"
          fi
        shell: bash

      - name: Verify LLM digest invariants (every document is a projector test case)
        run: |
          shopt -s nullglob
          for file in rfc/draft-*.md rfc/[0-9]*.md; do
            skill/rfc-render-llm --verify "$file"
          done
        shell: bash

      - name: Verify draft corpus declarations (blocking — red only by declaration)
        run: |
          shopt -s nullglob
          set -- rfc/draft-*.md
          if [ $# -gt 0 ]; then
            skill/rfc-run --expect "$@"
          else
            echo "No drafts"
          fi
        shell: bash

      - name: Per-document conformance report
        if: always()
        run: |
          shopt -s nullglob
          {
            echo "### RFC conformance — per document"
            echo ""
            echo "| document | lint | corpus | declared | digest |"
            echo "|---|---|---|---|---|"
            for f in rfc/draft-*.md rfc/[0-9]*.md; do
              n=$(basename "$f" .md)
              skill/rfc-lint "$f" >/dev/null 2>&1 && L="ok" || L="**FAIL**"
              if skill/rfc-run "$f" >/dev/null 2>&1; then C="green"; else C="red"; fi
              d=$(sed -n 's/^\*\*Corpus:\*\* *//p' "$f" | head -1); d="${d%% *}"; d="${d:-green}"
              [ "$C" = "$d" ] && D="$d" || D="**$d (STALE)**"
              skill/rfc-render-llm --verify "$f" >/dev/null 2>&1 && G="ok" || G="**FAIL**"
              echo "| $n | $L | $C | $D | $G |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
